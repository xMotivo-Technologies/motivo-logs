<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      // Runs before first paint so the dashboard never flashes light mode
      // before React hydrates and reads the saved preference.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <meta name="theme-color" content="#197d3f" />

    <meta
      name="description"
      content="Purchase verification numbers for the services you use every day. Get your number and receive your OTP in just a few clicks with Motivo Logs."
    />

    <meta
      name="keywords"
      content="verification numbers, OTP, OTP verification, virtual numbers, SMS verification, Nigeria, Motivo Logs"
    />

    <meta name="author" content="Motivo Logs" />

    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta property="og:url" content="https://www.motivologs.com/images/logo.png" />

    <meta
      property="og:title"
      content="Motivo Logs — Get Verification Numbers & OTPs"
    />

    <meta
      property="og:description"
      content="Purchase verification numbers for the services you use every day. Get your number and receive your OTP in just a few clicks."
    />

    <meta property="og:site_name" content="Motivo Logs" />

    <meta
      property="og:image"
      content="https://www.motivologs.com/images/logo.png"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Motivo Logs — Get Verification Numbers & OTPs"
    />

    <meta
      name="twitter:description"
      content="Purchase verification numbers for the services you use every day. Get your number and receive your OTP in just a few clicks."
    />

    <meta
      name="twitter:image"
      content="https://www.motivologs.com/images/logo.png"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/public/favicon.ico" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.motivologs.com/" />

    <title>Motivo Logs — Verification Numbers & OTPs</title>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
